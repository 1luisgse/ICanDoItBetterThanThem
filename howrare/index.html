        body {

            color: var(--text-white);

            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-white);
        }

        header h1 span {
            color: var(--primary-red);
        }

        header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .score-board span span {
            color: var(--text-white);
        }

        .event-image-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .event-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        /* Estilo del Slider Avanzado */
        .slider-section {
            width: 100%;
            margin-bottom: 24px;
        }

        .value-display {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-red);
            margin-bottom: 12px;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary-red);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .scale-markers {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 8px;
            padding: 0 2px;
            width: 100%;
        }

        /* Botón de Acción */
        .btn {
            background-color: var(--primary-red);
            color: var(--text-white);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 42, 42, 0.4);
        }

        .btn:hover {
            background-color: var(--primary-red-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Pantalla de Resultados */
        .result-box {
            display: none;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-diff {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-gray);
        }

            font-weight: 700;

            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

            color: var(--primary-red);
            font-size: 1.2rem;
        }

            background: linear-gradient(135deg, rgba(255, 42, 42, 0.15), rgba(255, 42, 42, 0.05));

            border-radius: 16px;

        let currentRound = 1;
        let totalScore = 0;
        let currentGameEvents = [];
        let activeEvent = null;

        const slider = document.getElementById('rare-slider');
        const sliderValDisplay = document.getElementById('slider-val-display');
        const eventTitle = document.getElementById('event-title');
        const eventImg = document.getElementById('event-img');
        const guessBtn = document.getElementById('guess-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const gameInterface = document.getElementById('game-interface');
        const resultInterface = document.getElementById('result-interface');
        
        const roundNumEl = document.getElementById('round-num');
        const totalScoreEl = document.getElementById('total-score');
        const diffValueEl = document.getElementById('diff-value');
        const pointsEarnedEl = document.getElementById('points-earned');
        const realValueDisplay = document.getElementById('real-value-display');
        const resultHeaderText = document.getElementById('result-header-text');
        const actualCardBox = document.getElementById('actual-card-box');

        function sliderToPercentage(val) {
            let v = parseInt(val);
            if (v <= 500) {
                return (v / 500) * 1.0;
            } else {
                let normalized = (v - 500) / 500;
                return 1.0 + Math.pow(normalized, 2) * 99.0;
            }
        }

        slider.addEventListener('input', () => {
            let realVal = sliderToPercentage(slider.value);
            if (realVal < 0.01) {
                sliderValDisplay.textContent = realVal.toFixed(4) + "%";
            } else if (realVal < 1) {
                sliderValDisplay.textContent = realVal.toFixed(3) + "%";
            } else if (realVal < 10) {
                sliderValDisplay.textContent = realVal.toFixed(2) + "%";
            } else {
                sliderValDisplay.textContent = realVal.toFixed(1) + "%";
            }
        });

        function initGame() {
            currentRound = 1;
            totalScore = 0;
            currentGameEvents = [...eventsDB].sort(() => Math.random() - 0.5);
            loadRound();
        }

        function loadRound() {
            if (currentRound > 5) {
                gameInterface.style.display = "none";
                resultInterface.style.display = "block";
                
                // --- PANTALLA FINAL MEJORADA Y LLAMATIVA ---
                let tierTitle = "";
                let tierIcon = "";
                
                if (totalScore >= 4500) {
                    tierTitle = "Top 1% — ¡Mente matemática legendaria!";
                    tierIcon = "fa-crown";
                } else if (totalScore >= 3500) {
                    tierTitle = "Top 5% — ¡Estadista de élite!";
                    tierIcon = "fa-fire";
                } else if (totalScore >= 2500) {
                    tierTitle = "Top 20% — ¡Gran intuición!";
                    tierIcon = "fa-chart-line";
                } else if (totalScore >= 1500) {
                    tierTitle = "Top 50% — Jugador promedio";
                    tierIcon = "fa-user";
                } else {
                    tierTitle = "Top 99% — ¡Aún puedes mejorar!";
                    tierIcon = "fa-seedling";
                }

                resultHeaderText.style.display = "none";
                diffValueEl.parentElement.style.display = "none";
                
                pointsEarnedEl.innerHTML = `
                    <div class="final-screen-badge">
                        <i class="fa-solid ${tierIcon}"></i>
                        <h3>Clasificación Global</h3>
                        <div class="player-tier">${tierTitle}</div>
                    </div>
                    <div class="final-score-big">${totalScore} PTS</div>
                    <div class="final-subtitle">Puntuación total acumulada en 5 rondas</div>
                `;
                
                actualCardBox.innerHTML = `¡Has completado el reto de probabilidades de <b>HowRare?</b> con éxito!`;
                
                nextBtn.textContent = "JUGAR OTRA VEZ";
                nextBtn.onclick = initGame;
                return;
            }

            resultHeaderText.style.display = "block";
            resultHeaderText.textContent = "Tu respuesta se desvió un:";
            diffValueEl.parentElement.style.display = "block";
            actualCardBox.style.display = "block";
            gameInterface.style.display = "block";
            resultInterface.style.display = "none";
            
            roundNumEl.textContent = currentRound;
            totalScoreEl.textContent = totalScore;

            activeEvent = currentGameEvents[currentRound - 1];
            eventTitle.textContent = activeEvent.title;
            eventImg.src = activeEvent.img;

            slider.value = 500;
            slider.dispatchEvent(new Event('input'));
        }

        guessBtn.addEventListener('click', () => {
            let userGuess = sliderToPercentage(slider.value);
            let actual = activeEvent.real;

            let diff = Math.abs(userGuess - actual);
            
            let maxPoints = 1000;
            let roundPoints = Math.max(0, Math.round(maxPoints * (1 - Math.min(diff / 10, 1))));
            
            if (diff <= 0.005 && actual < 0.1) {
                roundPoints = 1000;
            }

            totalScore += roundPoints;

            gameInterface.style.display = "none";
            resultInterface.style.display = "block";
            
            resultHeaderText.style.display = "block";
            resultHeaderText.textContent = "Tu respuesta se desvió un:";
            diffValueEl.parentElement.style.display = "block";
            diffValueEl.textContent = diff < 0.01 ? diff.toFixed(4) + "%" : diff.toFixed(2) + "%";
            pointsEarnedEl.textContent = `+${roundPoints} PUNTOS`;
            
            actualCardBox.innerHTML = `El porcentaje real era: <br><b>${actual}%</b>`;

            currentRound++;
            nextBtn.textContent = "SIGUIENTE CASO";
            nextBtn.onclick = loadRound;
        });

        initGame();
    </script>
